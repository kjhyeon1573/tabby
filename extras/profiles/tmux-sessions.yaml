# Example: one sidebar profile per tmux session.
#
# Merge the `profiles` and `groups` entries below into your Tabby config
# (~/.config/tabby/config.yaml on Linux,
#  ~/Library/Application Support/tabby/config.yaml on macOS).
#
# `tmux new-session -A -s NAME` attaches to session NAME if it exists and
# creates it otherwise. The profile sidebar reads NAME from the `-s` / `-t`
# argument, colours the icon green while that session is running and shows
# its current path (or ssh destination) next to the profile name.
# `weight: -1` keeps "tmux: main" above the numbered sessions, which are
# sorted numerically (0, 1, 2, ... 10).

profiles:
  - id: local:custom:tmux-main
    type: local
    name: 'tmux: main'
    group: tmux
    weight: -1
    icon: fas fa-layer-group
    color: '#7aa2f7'
    options:
      command: tmux
      args:
        - new-session
        - '-A'
        - '-s'
        - main
      cwd: null
      pauseAfterExit: false
      runAsAdministrator: false
  - id: local:custom:tmux-0
    type: local
    name: 'tmux: 0'
    group: tmux
    icon: fas fa-layer-group
    color: '#7aa2f7'
    options:
